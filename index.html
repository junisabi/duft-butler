<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duft-Butler</title>
  <meta name="description" content="Dein persönlicher Parfüm-Butler: Sammlung, Tagesvorschlag nach Wetter, Tagebuch, Blind-Buy-Check und Wunschliste.">
  <meta name="theme-color" content="#0f0d0c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duft-Butler">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v3H9zM10.5 5h3v2h-3zM7 7h10a2 2 0 0 1 2 2v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V9a2 2 0 0 1 2-2z" fill="currentColor"/></svg>
      <h1>Duft-Butler</h1>
    </div>
    <button id="btnSettings" class="icon-btn" data-act="settings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section id="view-today" class="view active" aria-label="Heute"></section>
    <section id="view-collection" class="view" aria-label="Sammlung"></section>
    <section id="view-diary" class="view" aria-label="Tagebuch"></section>
    <section id="view-blind" class="view" aria-label="Blind-Buy-Check"></section>
    <section id="view-wish" class="view" aria-label="Wunschliste"></section>
  </main>

  <nav class="tabbar" aria-label="Navigation">
    <button class="tab active" data-act="tab" data-view="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Heute</span>
    </button>
    <button class="tab" data-act="tab" data-view="collection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 2h5v3h-5zM10.5 5h3v2h-3zM7 7h10a2 2 0 0 1 2 2v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V9a2 2 0 0 1 2-2z"/></svg>
      <span>Sammlung</span>
    </button>
    <button class="tab" data-act="tab" data-view="diary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2zM5 17a2 2 0 0 1 2-2h12M9 7h6M9 10.5h4"/></svg>
      <span>Tagebuch</span>
    </button>
    <button class="tab" data-act="tab" data-view="blind">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8M8 10.5l1.8 1.8L13.5 8.5"/></svg>
      <span>Blind-Buy</span>
    </button>
    <button class="tab" data-act="tab" data-view="wish">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
      <span>Wünsche</span>
    </button>
  </nav>

  <dialog id="sheet" class="sheet"><div id="sheetBody" class="sheet-inner"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="sammlung.js"></script>
  <script src="app.js"></script>
</body>
</html>
